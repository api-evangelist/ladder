description: >-
  Ladder (Ladder Financial Inc., operating as Ladder Insurance Services, LLC) is a
  digital life insurance company founded in 2015 that sells flexible term life
  insurance fully online — a few health questions, no medical exam for policies up
  to $3M, 10-to-30 year terms, and "laddering" that lets a policyholder raise or
  lower coverage as their circumstances change. Policies are underwritten by
  partner carriers (Amica Life, Fidelity Security Life, and S.USA Life / Prosperity
  Life Group). Alongside the direct-to-consumer product, Ladder runs an embedded
  insurance distribution business: the Ladder API lets fintech, lending, investing,
  benefits, and health-and-wellness platforms embed quoting and a full term-life
  application into their own site or app in roughly ten lines of JavaScript, with
  a Quoter, Connector, Calculator, and Account Manager surface, and commission or
  marketing-fee revenue share. Access to the API is granted through a partner
  request rather than public self-service signup. Ladder is backed by Canaan
  Partners, General Catalyst, and Lightspeed Venture Partners.
