apis:
- aid: ladder-api
  name: Ladder API
  description: >-
    The Ladder API is an embedded term-life-insurance distribution surface for
    partner platforms. It is delivered primarily as a client-side JavaScript
    integration — a partner loads Ladder's v3 bundle, constructs a LadderAPI
    instance with a user auth token minted by the partner's own backend, and
    mounts one of Ladder's flows into a container element on the page. The
    published surfaces are the Embeddable API (the full white-labeled
    application flow), the Quoter API (price estimates in the partner's UI), the
    Connector (pre-fills known applicant data and deep-links into the right step
    of Ladder's application), the Calculator (coverage-needs questionnaire), and
    the Account Manager (lets a partner's users manage existing Ladder policies
    in-app). Reference documentation is gated behind a partner access request;
    the public surface documents the integration model, the loader, and the
    product set.
